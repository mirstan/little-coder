[project]
name = "little-coder-self-improve"
version = "0.1.0"
description = "GEPA-based self-improvement loop for little-coder's master prompt, principles, and skills"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dspy-ai>=3.3,<4.0",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
