[project]
name = "little-coder-self-improve"
version = "0.1.0"
description = "GEPA-based self-improvement loop for little-coder's master prompt, principles, and skills"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dspy-ai>=3.3,<4.0",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Real bug, confirmed by review: the prior `py-modules = []` (no `packages`)
# made `pip install -e .` build an EMPTY distribution -- verified by
# installing into a throwaway venv and confirming
# `import benchmarks.self_improve` failed from an unrelated directory. Every
# import in this codebase uses the fully-qualified `benchmarks.self_improve.*`
# name, but this pyproject.toml lives INSIDE that same directory
# (benchmarks/self_improve/), two path segments short of the name its own
# code expects -- package-dir maps the dotted name back onto ".", the
# directory this file already lives in, so setuptools finds real code at the
# path it actually sits at. Confirmed by installing into a fresh venv and
# importing benchmarks.self_improve(.ingest) from a completely unrelated cwd.
package-dir = {"benchmarks.self_improve" = "."}
packages = ["benchmarks.self_improve", "benchmarks.self_improve.ingest"]

[tool.setuptools.package-data]
# Real gap, confirmed by review: a NON-editable install (`pip install .`,
# vs. the `-e` install README.md actually documents) ships the .py modules
# above but not config/*.yaml -- run_gepa.py's --components-config default
# points there, so a non-editable install would fail unless every caller
# supplies an external config path.
"benchmarks.self_improve" = ["config/*.yaml"]
